<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Lato, Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Venndiagram – kvalitet, tid, kostnad och verksamhetsbehov med Conditional Go i mitten</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=block');</style>

  <!-- bakgrund som övriga slides -->
  <rect width="1280" height="720" fill="#4169E1"/>
  <path d="M0 690 L1280 652 L1280 720 L0 720 Z" fill="#2F55C4"/>
  <path d="M0 676 L620 702 L1280 720 L0 720 Z" fill="#483D8B"/>

  <!-- rubrik -->
  <text x="78" y="106" font-size="44" font-weight="700" fill="#FFFFFF">Kvalitet, tid, kostnad och verksamhetsbehov</text>
  <text x="80" y="148" font-size="22" fill="#DCE6FF">Go/No-Go är en avvägning – beslutet hamnar där alla fyra möts.</text>

  <!-- cirklar -->
  <g fill-opacity="0.7">
    <circle cx="320" cy="320" r="150" fill="#2E7D5B"/>
    <circle cx="520" cy="320" r="150" fill="#E0B341"/>
    <circle cx="320" cy="500" r="150" fill="#C8692A"/>
    <circle cx="520" cy="500" r="150" fill="#9DB8D3"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3">
    <circle cx="320" cy="320" r="150"/><circle cx="520" cy="320" r="150"/>
    <circle cx="320" cy="500" r="150"/><circle cx="520" cy="500" r="150"/>
  </g>

  <!-- etiketter -->
  <g font-size="26" font-weight="700" text-anchor="middle">
    <text x="262" y="276" fill="#FFFFFF">Kvalitet</text>
    <text x="578" y="276" fill="#1E2A38">Tid</text>
    <text x="262" y="560" fill="#FFFFFF">Kostnad</text>
    <text x="574" y="552" fill="#1E2A38">Verksamhets-</text>
    <text x="574" y="582" fill="#1E2A38">behov</text>
  </g>

  <!-- mitten -->
  <rect x="322" y="391" width="196" height="38" rx="19" fill="#FFD43B" stroke="#1E2A38" stroke-width="2"/>
  <text x="420" y="417" text-anchor="middle" font-size="19" font-weight="700" fill="#1E2A38">CONDITIONAL GO</text>

  <!-- förklaring -->
  <rect x="740" y="182" width="476" height="452" rx="24" fill="#EEF3FD"/>
  <g font-size="20" fill="#1E2A38">
    <circle cx="772" cy="224" r="12" fill="#2E7D5B"/>
    <text x="796" y="231" font-weight="700" fill="#1E3A8A">Kvalitet</text>
    <text x="796" y="259">0 Critical, 3 High kvar, prestanda</text>
    <text x="796" y="285">verifierad för 350 av 500 användare</text>

    <circle cx="772" cy="326" r="12" fill="#E0B341"/>
    <text x="796" y="333" font-weight="700" fill="#1E3A8A">Tid</text>
    <text x="796" y="361">Fast releasedatum vecka 12,</text>
    <text x="796" y="387">trots att SYS blev 5 dagar försenad</text>

    <circle cx="772" cy="428" r="12" fill="#C8692A"/>
    <text x="796" y="435" font-weight="700" fill="#1E3A8A">Kostnad</text>
    <text x="796" y="463">Tre testare i stället för fyra, och en</text>
    <text x="796" y="489">flytt kräver förlängt avtal för gamla systemet</text>

    <circle cx="772" cy="530" r="12" fill="#9DB8D3"/>
    <text x="796" y="537" font-weight="700" fill="#1E3A8A">Verksamhetsbehov</text>
    <text x="796" y="565">UAT godkänt, migreringen väntar och</text>
    <text x="796" y="591">gamla systemets avtal upphör vid årsskiftet</text>
  </g>
</svg>
