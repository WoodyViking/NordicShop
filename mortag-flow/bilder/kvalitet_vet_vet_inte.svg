<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Vad vet vi om kvaliteten – det vi vet, det vi inte vet och slutsatsen Conditional Go</title>
  <defs>
    <g id="ok">
      <circle r="14" fill="#2E7D5B"/>
      <path d="M-6 0 l4 4.5 l8 -9" fill="none" stroke="#FBFBF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="fraga">
      <circle r="14" fill="#C8692A"/>
      <text y="7" text-anchor="middle" font-size="20" font-weight="700" fill="#FBFBF8">?</text>
    </g>
  </defs>

  <!-- bakgrund -->
  <rect x="0" y="0" width="960" height="460" rx="24" fill="#F3F5F8"/>
  <rect x="20" y="20" width="920" height="420" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>

  <!-- rubrik -->
  <rect x="44" y="38" width="112" height="32" rx="16" fill="#1E2A38"/>
  <text x="100" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">SLUTSATS</text>
  <text x="170" y="61" font-size="22" font-weight="700" fill="#1E2A38">Vad vet vi om kvaliteten efter testperioden?</text>

  <!-- vänster: det vet vi -->
  <rect x="44" y="90" width="424" height="228" rx="16" fill="#EAF4EF"/>
  <text x="66" y="124" font-size="20" font-weight="700" fill="#2E7D5B">Det här vet vi</text>

  <use href="#ok" x="80" y="162"/>
  <text x="106" y="160" font-size="18" font-weight="700" fill="#1E2A38">Kärnflödena fungerar</text>
  <text x="106" y="180" font-size="15" fill="#4A5568">kredit, dubbelgodkännande, behörighet, E2E</text>

  <use href="#ok" x="80" y="218"/>
  <text x="106" y="216" font-size="18" font-weight="700" fill="#1E2A38">De allvarligaste felen är rättade</text>
  <text x="106" y="236" font-size="15" fill="#4A5568">DEF-101, 112 och 124 – inga Critical öppna</text>

  <use href="#ok" x="80" y="274"/>
  <text x="106" y="272" font-size="18" font-weight="700" fill="#1E2A38">Verksamheten har godkänt</text>
  <text x="106" y="292" font-size="15" fill="#4A5568">UAT godkänt med kända avvikelser</text>

  <!-- höger: det vet vi inte -->
  <rect x="492" y="90" width="424" height="228" rx="16" fill="#FBEFE6"/>
  <text x="514" y="124" font-size="20" font-weight="700" fill="#C8692A">Det här vet vi inte (än)</text>

  <use href="#fraga" x="528" y="162"/>
  <text x="554" y="160" font-size="18" font-weight="700" fill="#1E2A38">Prestanda över 350 användare</text>
  <text x="554" y="180" font-size="15" fill="#4A5568">kravet på 500 är inte verifierat</text>

  <use href="#fraga" x="528" y="218"/>
  <text x="554" y="216" font-size="18" font-weight="700" fill="#1E2A38">Resultatet för 22 tester</text>
  <text x="554" y="236" font-size="15" fill="#4A5568">10 utan status och 12 ej körda regressionstester</text>

  <use href="#fraga" x="528" y="274"/>
  <text x="554" y="272" font-size="18" font-weight="700" fill="#1E2A38">Om P1-målet på 95 % nåddes</text>
  <text x="554" y="292" font-size="15" fill="#4A5568">resultat per prioritet saknas</text>

  <!-- exit criteria -->
  <text x="44" y="356" font-size="16" font-weight="700" fill="#1E2A38">Exit criteria (10 st)</text>
  <rect x="44" y="368" width="126" height="26" rx="6" fill="#2E7D5B"/>
  <rect x="172" y="368" width="168" height="26" rx="6" fill="#E0B341"/>
  <rect x="342" y="368" width="84" height="26" rx="6" fill="#C0392B"/>
  <rect x="428" y="368" width="40" height="26" rx="6" fill="#8A97A8"/>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="107" y="386" fill="#FBFBF8">3 uppfyllda</text>
    <text x="256" y="386" fill="#1E2A38">4 delvis</text>
    <text x="384" y="386" fill="#FBFBF8">2 ej</text>
    <text x="448" y="386" fill="#FBFBF8">1</text>
  </g>
  <text x="44" y="418" font-size="14" fill="#4A5568">Ej uppfyllda: 3 öppna High i P1 och R11. Det tionde avgjordes i Go/No-Go.</text>

  <!-- slutsats -->
  <rect x="492" y="342" width="424" height="84" rx="16" fill="#FFF8DB" stroke="#E8A100" stroke-width="2"/>
  <rect x="510" y="356" width="166" height="32" rx="16" fill="#FFD43B" stroke="#E8A100" stroke-width="2"/>
  <text x="593" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#1E2A38">CONDITIONAL GO</text>
  <text x="690" y="378" font-size="17" font-weight="700" fill="#1E2A38">Tillräcklig kvalitet</text>
  <text x="510" y="412" font-size="15" fill="#1E2A38">för en villkorad release – om riskerna följs upp</text>
</svg>
