<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Förändringen – fyra förändringar, påverkan, åtgärder, prioriteringar och kvarstående risk</title>

  <!-- bakgrund -->
  <rect x="0" y="0" width="960" height="540" rx="24" fill="#F3F5F8"/>

  <!-- rubrik -->
  <rect x="24" y="22" width="164" height="32" rx="16" fill="#1E2A38"/>
  <text x="106" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">FÖRÄNDRINGEN</text>
  <text x="202" y="45" font-size="22" font-weight="700" fill="#1E2A38">Fyra förändringar samtidigt – och releasedatumet ligger fast</text>

  <!-- kort -->
  <g fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2">
    <rect x="24" y="72" width="216" height="290" rx="16"/>
    <rect x="256" y="72" width="216" height="290" rx="16"/>
    <rect x="488" y="72" width="216" height="290" rx="16"/>
    <rect x="720" y="72" width="216" height="290" rx="16"/>
  </g>

  <!-- ikoner -->
  <g transform="translate(70 116)">
    <circle r="26" fill="#2F6690"/>
    <circle cx="0" cy="-7" r="6.5" fill="#FBFBF8"/>
    <path d="M-12 13 Q-12 -1 0 -1 Q12 -1 12 13 Z" fill="#FBFBF8"/>
    <circle cx="15" cy="-14" r="8" fill="#C0392B" stroke="#FBFBF8" stroke-width="2"/>
    <path d="M12 -17 l6 6 M18 -17 l-6 6" stroke="#FBFBF8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(302 116)">
    <circle r="26" fill="#2F6690"/>
    <rect x="-12" y="-13" width="24" height="11" rx="2" fill="#FBFBF8"/>
    <rect x="-12" y="1" width="24" height="11" rx="2" fill="#FBFBF8"/>
    <circle cx="-6" cy="-7.5" r="1.8" fill="#2F6690"/><circle cx="-6" cy="6.5" r="1.8" fill="#2F6690"/>
    <circle cx="15" cy="-14" r="9" fill="#C8692A" stroke="#FBFBF8" stroke-width="2"/>
    <path d="M15 -19 v5 l3 2" fill="none" stroke="#FBFBF8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(534 116)">
    <circle r="26" fill="#2F6690"/>
    <path d="M0 -14 L12 -9 V0 Q12 10 0 15 Q-12 10 -12 0 V-9 Z" fill="#FBFBF8"/>
    <path d="M-5 0 l4 4 l7 -8" fill="none" stroke="#2F6690" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(766 116)">
    <circle r="26" fill="#2F6690"/>
    <rect x="-13" y="-10" width="26" height="23" rx="3" fill="#FBFBF8"/>
    <rect x="-13" y="-10" width="26" height="7" rx="2" fill="#E0B341"/>
    <line x1="-7" y1="-14" x2="-7" y2="-7" stroke="#FBFBF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="7" y1="-14" x2="7" y2="-7" stroke="#FBFBF8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" font-size="10" font-weight="700" fill="#1E2A38">v12</text>
  </g>

  <!-- nummer -->
  <g font-size="15" font-weight="700" fill="#8A97A8" text-anchor="end">
    <text x="222" y="100">1</text><text x="454" y="100">2</text><text x="686" y="100">3</text><text x="918" y="100">4</text>
  </g>

  <!-- rubriker per kort -->
  <g font-size="19" font-weight="700" fill="#1E2A38">
    <text x="44" y="168">Testare B lämnar</text>
    <text x="276" y="168">SYS försenad</text>
    <text x="508" y="168">Nytt krav: R11</text>
    <text x="740" y="168">Fast releasedatum</text>
  </g>
  <g font-size="14" fill="#4A5568">
    <text x="44" y="188">4 → 3 testare, ingen ersättare</text>
    <text x="276" y="188">5 arbetsdagar</text>
    <text x="508" y="188">verifiering + logg av rolländring</text>
    <text x="740" y="188">release vecka 12</text>
  </g>

  <g stroke="#E3E8EE" stroke-width="2">
    <line x1="44" y1="202" x2="220" y2="202"/><line x1="276" y1="202" x2="452" y2="202"/>
    <line x1="508" y1="202" x2="684" y2="202"/><line x1="740" y1="202" x2="916" y2="202"/>
  </g>

  <!-- påverkan -->
  <g font-size="12" font-weight="700" fill="#C0392B" letter-spacing="1">
    <text x="44" y="224">PÅVERKAN</text><text x="276" y="224">PÅVERKAN</text>
    <text x="508" y="224">PÅVERKAN</text><text x="740" y="224">PÅVERKAN</text>
  </g>
  <g font-size="15" fill="#1E2A38">
    <text x="44" y="244">Systemtest och E2E</text><text x="44" y="262">saknar ägare</text>
    <text x="276" y="244">Systemtestet kortas från</text><text x="276" y="262">fyra till tre veckor</text>
    <text x="508" y="244">Nytt P1-område</text><text x="508" y="262">utan extra tid</text>
    <text x="740" y="244">Förseningar kan inte</text><text x="740" y="262">lösas med mer tid</text>
  </g>

  <!-- åtgärd -->
  <g font-size="12" font-weight="700" fill="#2E7D5B" letter-spacing="1">
    <text x="44" y="290">ÅTGÄRD</text><text x="276" y="290">ÅTGÄRD</text>
    <text x="508" y="290">ÅTGÄRD</text><text x="740" y="290">ÅTGÄRD</text>
  </g>
  <g font-size="15" fill="#1E2A38">
    <text x="44" y="310">D tar systemtest, E2E</text><text x="44" y="328">delas av A, C och D</text><text x="44" y="346">Överlämning (A18)</text>
    <text x="276" y="310">Väntetiden används till</text><text x="276" y="328">testfall, testdata</text><text x="276" y="346">och automation</text>
    <text x="508" y="310">Fem nya testfall (A19)</text><text x="508" y="328">granskas av</text><text x="508" y="346">säkerhetsspecialisten</text>
    <text x="740" y="310">Riskbaserad prioritering</text><text x="740" y="328">Testplan v2.0 med</text><text x="740" y="346">ny tidplan</text>
  </g>

  <!-- prioriteringar -->
  <rect x="24" y="378" width="448" height="142" rx="16" fill="#E6EEF6"/>
  <rect x="44" y="392" width="162" height="28" rx="14" fill="#2F6690"/>
  <text x="125" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#FBFBF8">PRIORITERINGAR</text>
  <g font-size="16" fill="#1E2A38">
    <circle cx="50" cy="438" r="4" fill="#2F6690"/><text x="62" y="443"><tspan font-weight="700">P1 först</tspan> – testas alltid fullt ut</text>
    <circle cx="50" cy="460" r="4" fill="#2F6690"/><text x="62" y="465"><tspan font-weight="700">P2-målet</tspan> sänks från 90 % till 80 %</text>
    <circle cx="50" cy="482" r="4" fill="#2F6690"/><text x="62" y="487"><tspan font-weight="700">Edge och Firefox</tspan> testas som stickprov</text>
    <circle cx="50" cy="504" r="4" fill="#2F6690"/><text x="62" y="509"><tspan font-weight="700">Rapporter och statistik</tspan> nedprioriteras till P3</text>
  </g>

  <!-- kvarstående risk -->
  <rect x="488" y="378" width="448" height="142" rx="16" fill="#FBEFE6"/>
  <rect x="508" y="392" width="184" height="28" rx="14" fill="#C8692A"/>
  <text x="600" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#FBFBF8">KVARSTÅENDE RISK</text>
  <g font-size="16" fill="#1E2A38">
    <circle cx="514" cy="438" r="4" fill="#C8692A"/><text x="526" y="443"><tspan font-weight="700">PR12:</tspan> kompetens försvinner med Testare B</text>
    <circle cx="514" cy="460" r="4" fill="#C8692A"/><text x="526" y="465"><tspan font-weight="700">PR13:</tspan> komprimerat systemtest, fel hittas sent</text>
    <circle cx="514" cy="482" r="4" fill="#C8692A"/><text x="526" y="487"><tspan font-weight="700">PR14:</tspan> R11 kom sent och kan misstolkas</text>
    <circle cx="514" cy="504" r="4" fill="#C8692A"/><text x="526" y="509"><tspan font-weight="700">Lägre P2-täckning</tspan> redovisas vid Go/No-Go</text>
  </g>
</svg>
