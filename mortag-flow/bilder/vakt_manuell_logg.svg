<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Säkerhetsvakt skriver i manuell logg – High 2: kompenserande kontroll, godkänd avvikelse och planerad hotfix</title>

  <!-- bakgrund -->
  <rect x="0" y="0" width="900" height="460" rx="24" fill="#F3F5F8"/>
  <circle cx="230" cy="250" r="190" fill="#E3EAF2"/>

  <!-- vakt: kropp -->
  <path d="M150 300 Q150 228 230 222 Q310 228 310 300 L310 420 L150 420 Z" fill="#2C4A6E" stroke="#1E2A38" stroke-width="4"/>
  <!-- skjortkrage och slips -->
  <path d="M205 224 L230 256 L255 224 Z" fill="#D6E4F0" stroke="#1E2A38" stroke-width="3" stroke-linejoin="round"/>
  <path d="M226 236 L234 236 L238 270 L230 280 L222 270 Z" fill="#1E2A38"/>
  <!-- axelklaffar -->
  <rect x="160" y="238" width="34" height="10" rx="4" fill="#1E2A38" transform="rotate(-18 177 243)"/>
  <rect x="266" y="238" width="34" height="10" rx="4" fill="#1E2A38" transform="rotate(18 283 243)"/>
  <!-- bröstmärke -->
  <path d="M272 262 L290 262 L290 278 Q281 290 272 278 Z" fill="#E0B341" stroke="#1E2A38" stroke-width="2.5"/>

  <!-- hals och huvud -->
  <rect x="216" y="190" width="28" height="34" fill="#E9B98F"/>
  <circle cx="230" cy="154" r="46" fill="#F2C9A0" stroke="#1E2A38" stroke-width="4"/>
  <!-- vaktkeps med skärm och märke -->
  <path d="M182 140 Q184 96 230 94 Q276 96 278 140 Z" fill="#2C4A6E" stroke="#1E2A38" stroke-width="4" stroke-linejoin="round"/>
  <path d="M180 140 L280 140 Q272 156 230 154 Q188 156 180 140 Z" fill="#1E2A38"/>
  <path d="M222 108 L238 108 L238 122 Q230 130 222 122 Z" fill="#E0B341" stroke="#1E2A38" stroke-width="2"/>
  <!-- ansikte, blicken ner mot boken -->
  <path d="M208 170 Q214 175 220 170" fill="none" stroke="#1E2A38" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M240 170 Q246 175 252 170" fill="none" stroke="#1E2A38" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M220 188 Q230 192 240 188" fill="none" stroke="#1E2A38" stroke-width="3.5" stroke-linecap="round"/>

  <!-- armar ner mot boken -->
  <path d="M166 256 L150 300 L178 318" fill="none" stroke="#1E2A38" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 256 L150 300 L178 318" fill="none" stroke="#2C4A6E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M294 256 L312 298 L284 312" fill="none" stroke="#1E2A38" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M294 256 L312 298 L284 312" fill="none" stroke="#2C4A6E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- skrivbord -->
  <rect x="80" y="332" width="320" height="100" fill="#B9875A"/>
  <rect x="80" y="326" width="320" height="16" rx="4" fill="#A0703F"/>

  <!-- loggbok: pärm och uppslag -->
  <path d="M126 342 L230 334 L334 342 L322 300 L230 292 L138 300 Z" fill="#8A2E2E" stroke="#1E2A38" stroke-width="3" stroke-linejoin="round"/>
  <path d="M134 336 L228 328 L228 290 L146 296 Z" fill="#FBFBF8" stroke="#1E2A38" stroke-width="3" stroke-linejoin="round"/>
  <path d="M232 328 L326 336 L314 296 L232 290 Z" fill="#FBFBF8" stroke="#1E2A38" stroke-width="3" stroke-linejoin="round"/>
  <!-- rader på vänster sida -->
  <path d="M152 304 L218 299 M150 313 L218 308 M148 322 L218 317" stroke="#8A97A8" stroke-width="2"/>
  <!-- rader på höger sida, med skrift -->
  <path d="M242 299 L306 304 M242 308 L309 313" stroke="#8A97A8" stroke-width="2"/>
  <path d="M244 305 q4 -5 8 0 t8 0 t8 0 M244 314 q4 -5 8 0 t8 0" fill="none" stroke="#2F6690" stroke-width="2"/>

  <!-- händer och penna -->
  <circle cx="180" cy="318" r="12" fill="#F2C9A0" stroke="#1E2A38" stroke-width="3"/>
  <line x1="290" y1="300" x2="266" y2="322" stroke="#1E2A38" stroke-width="8" stroke-linecap="round"/>
  <line x1="290" y1="300" x2="268" y2="320" stroke="#E0B341" stroke-width="4" stroke-linecap="round"/>
  <circle cx="286" cy="311" r="12" fill="#F2C9A0" stroke="#1E2A38" stroke-width="3"/>

  <!-- pratbubbla -->
  <path d="M330 40 h150 a16 16 0 0 1 16 16 v42 a16 16 0 0 1 -16 16 h-108 l-30 22 l6 -22 h-18 a16 16 0 0 1 -16 -16 v-42 a16 16 0 0 1 16 -16 z" fill="#2F6690"/>
  <text x="405" y="87" text-anchor="middle" font-size="32" font-weight="700" fill="#FBFBF8" letter-spacing="1">Loggat!</text>

  <!-- infokort -->
  <rect x="420" y="140" width="446" height="300" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>
  <g transform="translate(0 -10)">
  <rect x="444" y="172" width="78" height="32" rx="16" fill="#1E2A38"/>
  <text x="483" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">HIGH 2</text>
  <text x="536" y="195" font-size="20" font-weight="700" fill="#1E2A38">Kompenserande kontroll</text>

  <circle cx="462" cy="238" r="16" fill="#2F6690"/>
  <text x="462" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">1</text>
  <text x="492" y="236" font-size="19" font-weight="700" fill="#1E2A38">Manuell loggning av tidigare roll</text>
  <text x="492" y="258" font-size="16" fill="#4A5568">införs från dag 1</text>

  <circle cx="462" cy="292" r="16" fill="#2F6690"/>
  <text x="462" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">2</text>
  <text x="492" y="290" font-size="19" font-weight="700" fill="#1E2A38">Säkerhetsspecialisten godkänner</text>
  <text x="492" y="312" font-size="16" fill="#4A5568">avvikelsen</text>

  <circle cx="462" cy="346" r="16" fill="#2F6690"/>
  <text x="462" y="353" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">3</text>
  <text x="492" y="344" font-size="19" font-weight="700" fill="#1E2A38">Hotfix planeras med datum</text>
  <text x="492" y="366" font-size="16" fill="#4A5568">och läggs in i planen</text>

  <line x1="444" y1="388" x2="842" y2="388" stroke="#E3E8EE" stroke-width="2"/>
  <text x="444" y="412" font-size="16" fill="#1E2A38"><tspan font-weight="700">Ansvar:</tspan> säkerhetsspecialist och utvecklingsteamen</text>
  <text x="444" y="432" font-size="16" fill="#1E2A38"><tspan font-weight="700">Klart:</tspan> före produktionssättning</text>
  </g>
</svg>
