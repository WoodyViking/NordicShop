<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Tidplan före och efter omplanering – version 1.1 jämfört med version 2.1</title>

  <!-- bakgrund -->
  <rect x="0" y="0" width="960" height="460" rx="24" fill="#F3F5F8"/>
  <rect x="20" y="20" width="920" height="420" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>

  <!-- rubrik -->
  <rect x="44" y="38" width="112" height="32" rx="16" fill="#1E2A38"/>
  <text x="100" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">TIDPLAN</text>
  <text x="170" y="61" font-size="22" font-weight="700" fill="#1E2A38">Före och efter omplaneringen</text>

  <!-- förklaring -->
  <rect x="628" y="46" width="34" height="8" rx="4" fill="#C5CED9"/>
  <text x="670" y="55" font-size="15" fill="#4A5568">Plan v1.1</text>
  <rect x="752" y="43" width="34" height="14" rx="5" fill="#2F6690"/>
  <text x="794" y="55" font-size="15" fill="#4A5568">Ny plan v2.1</text>

  <!-- veckohuvud: kolumn v = 260 + (v-1)*55 -->
  <g font-size="14" font-weight="700" fill="#4A5568" text-anchor="middle">
    <text x="287" y="104">v1</text><text x="342" y="104">v2</text><text x="397" y="104">v3</text>
    <text x="452" y="104">v4</text><text x="507" y="104">v5</text><text x="562" y="104">v6</text>
    <text x="617" y="104">v7</text><text x="672" y="104">v8</text><text x="727" y="104">v9</text>
    <text x="782" y="104">v10</text><text x="837" y="104">v11</text><text x="892" y="104">v12</text>
  </g>

  <!-- rutnät -->
  <g stroke="#EEF1F5" stroke-width="1.5">
    <line x1="315" y1="114" x2="315" y2="404"/><line x1="370" y1="114" x2="370" y2="404"/>
    <line x1="425" y1="114" x2="425" y2="404"/><line x1="480" y1="114" x2="480" y2="404"/>
    <line x1="535" y1="114" x2="535" y2="404"/><line x1="590" y1="114" x2="590" y2="404"/>
    <line x1="645" y1="114" x2="645" y2="404"/><line x1="700" y1="114" x2="700" y2="404"/>
    <line x1="755" y1="114" x2="755" y2="404"/><line x1="810" y1="114" x2="810" y2="404"/>
    <line x1="865" y1="114" x2="865" y2="404"/>
  </g>
  <g stroke="#E3E8EE" stroke-width="1.5">
    <line x1="44" y1="146" x2="916" y2="146"/><line x1="44" y1="178" x2="916" y2="178"/>
    <line x1="44" y1="210" x2="916" y2="210"/><line x1="44" y1="242" x2="916" y2="242"/>
    <line x1="44" y1="274" x2="916" y2="274"/><line x1="44" y1="306" x2="916" y2="306"/>
    <line x1="44" y1="338" x2="916" y2="338"/><line x1="44" y1="370" x2="916" y2="370"/>
  </g>

  <!-- SYS-försening, markering vecka 5 -->
  <rect x="482" y="112" width="51" height="294" rx="6" fill="#C0392B" opacity="0.06"/>
  <line x1="482" y1="112" x2="482" y2="406" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- aktivitetsnamn -->
  <g font-size="16" fill="#1E2A38">
    <text x="44" y="136">Testanalys och testdesign</text>
    <text x="44" y="168">Testdata och miljö</text>
    <text x="44" y="200">SIT</text>
    <text x="44" y="232" font-weight="700" fill="#C8692A">Systemtest</text>
    <text x="44" y="264">E2E-test</text>
    <text x="44" y="296">UAT</text>
    <text x="44" y="328">Regression och retest</text>
    <text x="44" y="360">Release Readiness</text>
    <text x="44" y="392">Go/No-Go och release</text>
  </g>

  <!-- gamla staplar (v1.1) -->
  <g fill="#C5CED9">
    <rect x="263" y="119" width="104" height="7" rx="3.5"/>
    <rect x="373" y="151" width="49" height="7" rx="3.5"/>
    <rect x="428" y="183" width="104" height="7" rx="3.5"/>
    <rect x="483" y="215" width="214" height="7" rx="3.5"/>
    <rect x="593" y="247" width="104" height="7" rx="3.5"/>
    <rect x="648" y="279" width="104" height="7" rx="3.5"/>
    <rect x="703" y="311" width="104" height="7" rx="3.5"/>
    <rect x="813" y="343" width="49" height="7" rx="3.5"/>
    <rect x="868" y="375" width="49" height="7" rx="3.5"/>
  </g>

  <!-- nya staplar (v2.1) -->
  <rect x="263" y="129" width="104" height="13" rx="5" fill="#2F6690"/>
  <rect x="318" y="161" width="104" height="13" rx="5" fill="#2F6690"/>
  <rect x="373" y="193" width="159" height="13" rx="5" fill="#2F6690"/>
  <rect x="538" y="225" width="214" height="13" rx="5" fill="#C8692A"/>
  <rect x="483" y="257" width="214" height="13" rx="5" fill="#2F6690"/>
  <rect x="648" y="289" width="104" height="13" rx="5" fill="#2F6690"/>
  <rect x="483" y="321" width="214" height="13" rx="5" fill="#9DB8D3"/>
  <rect x="703" y="321" width="159" height="13" rx="5" fill="#2F6690"/>
  <rect x="758" y="353" width="104" height="13" rx="5" fill="#2F6690"/>
  <rect x="868" y="385" width="49" height="13" rx="5" fill="#2E7D5B"/>

  <!-- pil som visar att systemtest flyttas -->
  <path d="M700 218 h40" fill="none" stroke="#C8692A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M736 213 l8 5 l-8 5" fill="none" stroke="#C8692A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- etiketter i staplar -->
  <text x="590" y="330" text-anchor="middle" font-size="12" dominant-baseline="auto" fill="#1E2A38">retest, mindre omfattning</text>
  <text x="782" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#FBFBF8">full regression</text>

  <!-- lås på releasedatum -->
  <g transform="translate(846 392)">
    <rect x="-9" y="-6" width="18" height="14" rx="3" fill="#1E2A38"/>
    <path d="M-5 -6 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#1E2A38" stroke-width="2.5"/>
  </g>

  <!-- fotnot -->
  <text x="44" y="428" font-size="15" fill="#1E2A38"><tspan font-weight="700" fill="#C0392B">SYS +5 dagar:</tspan> systemtest flyttas en vecka  ·  <tspan font-weight="700">E2E och retest</tspan> startar tidigare  ·  <tspan font-weight="700">Release</tspan> ligger fast i vecka 12</text>
</svg>
