<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Lato, Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Gruppens tre viktigaste slutsatser</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;display=block');</style>

  <!-- bakgrund som övriga slides -->
  <rect width="1280" height="720" fill="#4169E1"/>
  <path d="M0 690 L1280 652 L1280 720 L0 720 Z" fill="#2F55C4"/>
  <path d="M0 676 L620 702 L1280 720 L0 720 Z" fill="#483D8B"/>

  <!-- rubrik -->
  <text x="78" y="126" font-size="46" font-weight="700" fill="#FFFFFF">Gruppens viktigaste slutsatser</text>
  <text x="80" y="170" font-size="22" fill="#DCE6FF">Det här tar vi med oss från MortgageFlow.</text>

  <!-- kort -->
  <g fill="#EEF3FD">
    <rect x="64" y="204" width="368" height="420" rx="28"/>
    <rect x="456" y="204" width="368" height="420" rx="28"/>
    <rect x="848" y="204" width="368" height="420" rx="28"/>
  </g>

  <!-- nummer -->
  <g font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="126" cy="270" r="34" fill="#483D8B"/><text x="126" y="283">1</text>
    <circle cx="518" cy="270" r="34" fill="#483D8B"/><text x="518" y="283">2</text>
    <circle cx="910" cy="270" r="34" fill="#483D8B"/><text x="910" y="283">3</text>
  </g>

  <!-- rubriker -->
  <g font-size="26" font-weight="700" fill="#1E3A8A">
    <text x="92" y="350">Riskbaserad prioritering</text><text x="92" y="382">bar projektet</text>
    <text x="484" y="350">Spårbarhet är en del</text><text x="484" y="382">av kvaliteten</text>
    <text x="876" y="350">Go/No-Go är ett riskbeslut,</text><text x="876" y="382">inte en siffra</text>
  </g>
  <g stroke="#C9D6F5" stroke-width="2">
    <line x1="92" y1="408" x2="404" y2="408"/>
    <line x1="484" y1="408" x2="796" y2="408"/>
    <line x1="876" y1="408" x2="1188" y2="408"/>
  </g>

  <!-- motivering -->
  <g font-size="20" fill="#1E2A38">
    <text x="92" y="446">När vi blev tre testare och</text>
    <text x="92" y="474">SYS försenades kunde vi</text>
    <text x="92" y="502">skydda P1 och medvetet</text>
    <text x="92" y="530">sänka P2, i stället för att</text>
    <text x="92" y="558">tappa allt lite grann.</text>

    <text x="484" y="446">10 tester utan status och</text>
    <text x="484" y="474">inga resultat per prioritet</text>
    <text x="484" y="502">gjorde att vi inte kunde</text>
    <text x="484" y="530">svara på om P1-målet</text>
    <text x="484" y="558">nåddes.</text>

    <text x="876" y="446">Conditional Go fungerar</text>
    <text x="876" y="474">bara när varje villkor har</text>
    <text x="876" y="502">en ägare och ett datum</text>
    <text x="876" y="530">för uppföljning.</text>
  </g>
</svg>
