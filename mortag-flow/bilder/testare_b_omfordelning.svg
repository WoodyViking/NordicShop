<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Testare B lämnar – uppgifterna fördelas om till testare A, C och D</title>
  <defs>
    <g id="person">
      <circle cx="0" cy="-30" r="18"/>
      <path d="M-30 30 Q-30 -6 0 -6 Q30 -6 30 30 Z"/>
    </g>
    <marker id="pilb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F6690"/>
    </marker>
    <marker id="pilo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C8692A"/>
    </marker>
  </defs>

  <!-- bakgrund -->
  <rect x="0" y="0" width="900" height="460" rx="24" fill="#F3F5F8"/>
  <circle cx="230" cy="250" r="190" fill="#E3EAF2"/>

  <!-- testare B, lämnar -->
  <g transform="translate(230 112)">
    <use href="#person" fill="#FFFFFF" stroke="#8A97A8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="0" y="20" text-anchor="middle" font-size="20" font-weight="700" fill="#8A97A8">B</text>
  </g>
  <g transform="translate(262 72)">
    <circle r="13" fill="#C0392B" stroke="#FBFBF8" stroke-width="2.5"/>
    <path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#FBFBF8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="290" y="117" font-size="15" font-weight="700" fill="#C0392B">lämnar</text>

  <!-- streckade linjer från B till uppgifterna -->
  <path d="M212 146 L172 186" fill="none" stroke="#8A97A8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <path d="M248 146 L292 186" fill="none" stroke="#8A97A8" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- uppgifter -->
  <rect x="118" y="188" width="104" height="34" rx="17" fill="#2F6690"/>
  <text x="170" y="211" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">E2E-test</text>
  <rect x="236" y="188" width="128" height="34" rx="17" fill="#C8692A"/>
  <text x="300" y="211" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">Systemtest</text>

  <!-- pilar till nya ägare -->
  <path d="M156 224 L132 270" fill="none" stroke="#2F6690" stroke-width="2.5" marker-end="url(#pilb)"/>
  <path d="M178 224 L218 270" fill="none" stroke="#2F6690" stroke-width="2.5" marker-end="url(#pilb)"/>
  <path d="M200 222 Q260 240 306 272" fill="none" stroke="#2F6690" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#pilb)"/>
  <path d="M314 224 L328 270" fill="none" stroke="#C8692A" stroke-width="3.5" marker-end="url(#pilo)"/>

  <!-- testare A, C, D -->
  <g transform="translate(130 330)">
    <use href="#person" fill="#1E2A38"/>
    <text x="0" y="20" text-anchor="middle" font-size="20" font-weight="700" fill="#FBFBF8">A</text>
  </g>
  <g transform="translate(230 330)">
    <use href="#person" fill="#2F6690"/>
    <text x="0" y="20" text-anchor="middle" font-size="20" font-weight="700" fill="#FBFBF8">C</text>
  </g>
  <g transform="translate(330 330)">
    <use href="#person" fill="#1E2A38"/>
    <text x="0" y="20" text-anchor="middle" font-size="20" font-weight="700" fill="#FBFBF8">D</text>
  </g>
  <g font-size="14" fill="#1E2A38" text-anchor="middle">
    <text x="130" y="384">API, prestanda</text>
    <text x="230" y="384">verksamhet</text>
    <text x="330" y="384">huvudansvar</text>
    <text x="330" y="401">systemtest</text>
  </g>

  <!-- pratbubbla -->
  <path d="M420 40 h236 a16 16 0 0 1 16 16 v42 a16 16 0 0 1 -16 16 h-198 l-56 22 l20 -22 h-2 a16 16 0 0 1 -16 -16 v-42 a16 16 0 0 1 16 -16 z" fill="#2F6690"/>
  <text x="538" y="87" text-anchor="middle" font-size="28" font-weight="700" fill="#FBFBF8">Tre i stället för fyra</text>

  <!-- infokort -->
  <rect x="420" y="140" width="446" height="300" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>
  <g transform="translate(0 -10)">
  <rect x="444" y="172" width="156" height="32" rx="16" fill="#1E2A38"/>
  <text x="522" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">OMPLANERING</text>
  <text x="614" y="195" font-size="20" font-weight="700" fill="#1E2A38">Testare B lämnar</text>

  <circle cx="462" cy="238" r="16" fill="#C8692A"/>
  <text x="462" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">1</text>
  <text x="492" y="236" font-size="19" font-weight="700" fill="#1E2A38">Systemtest → Testare D</text>
  <text x="492" y="258" font-size="16" fill="#4A5568">huvudansvar, med stöd av A och säkerhet</text>

  <circle cx="462" cy="292" r="16" fill="#2F6690"/>
  <text x="462" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">2</text>
  <text x="492" y="290" font-size="19" font-weight="700" fill="#1E2A38">E2E-test → Testare C, A och D</text>
  <text x="492" y="312" font-size="16" fill="#4A5568">C börjar v5–6, A och D tar över v7–8</text>

  <circle cx="462" cy="346" r="16" fill="#2F6690"/>
  <text x="462" y="353" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">3</text>
  <text x="492" y="344" font-size="19" font-weight="700" fill="#1E2A38">Kunskapsöverlämning (A18)</text>
  <text x="492" y="366" font-size="16" fill="#4A5568">B:s testfall och spårbarhetsmatris gås igenom</text>

  <line x1="444" y1="388" x2="842" y2="388" stroke="#E3E8EE" stroke-width="2"/>
  <text x="444" y="412" font-size="16" fill="#1E2A38"><tspan font-weight="700">Konsekvens:</tspan> P2-målet sänks från 90 % till 80 %</text>
  <text x="444" y="432" font-size="16" fill="#1E2A38"><tspan font-weight="700">Fast:</tspan> ingen ersättare och releasedatumet ligger kvar</text>
  </g>
</svg>
