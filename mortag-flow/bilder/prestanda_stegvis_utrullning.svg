<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Prestanda – stegvis utrullning med 350 användare, övervakning med rollback-tröskel och lasttest med 500 användare</title>
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- bakgrund -->
  <rect x="0" y="0" width="900" height="460" rx="24" fill="#F3F5F8"/>
  <circle cx="230" cy="250" r="190" fill="#E3EAF2"/>

  <!-- trappsteg -->
  <rect x="60" y="330" width="112" height="100" rx="6" fill="#9DB8D3" stroke="#1E2A38" stroke-width="3"/>
  <rect x="172" y="260" width="112" height="170" rx="6" fill="#5F8DB8" stroke="#1E2A38" stroke-width="3"/>
  <rect x="284" y="190" width="112" height="240" rx="6" fill="#2F6690" stroke="#1E2A38" stroke-width="3"/>
  <text x="116" y="392" text-anchor="middle" font-size="34" font-weight="700" fill="#1E2A38">350</text>
  <text x="228" y="314" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">Förstärkt</text>
  <text x="228" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">övervakning</text>
  <text x="340" y="252" text-anchor="middle" font-size="34" font-weight="700" fill="#FBFBF8">500</text>
  <text x="116" y="416" text-anchor="middle" font-size="14" fill="#1E2A38">användare</text>
  <text x="340" y="276" text-anchor="middle" font-size="14" fill="#D6E4F0">användare</text>

  <!-- steg 1: användare -->
  <g fill="#1E2A38">
    <circle cx="90" cy="290" r="10"/><path d="M74 326 Q74 304 90 304 Q106 304 106 326 Z"/>
    <circle cx="142" cy="290" r="10"/><path d="M126 326 Q126 304 142 304 Q158 304 158 326 Z"/>
  </g>
  <g fill="#2F6690">
    <circle cx="116" cy="282" r="12"/><path d="M97 326 Q97 298 116 298 Q135 298 135 326 Z"/>
  </g>

  <!-- steg 2: övervakningsskärm med tröskel -->
  <rect x="184" y="170" width="88" height="62" rx="6" fill="#FFFFFF" stroke="#1E2A38" stroke-width="3"/>
  <line x1="190" y1="190" x2="266" y2="190" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polyline points="192,222 206,214 218,218 232,204 246,208 262,200" fill="none" stroke="#2E7D5B" stroke-width="3" stroke-linejoin="round"/>
  <rect x="220" y="232" width="16" height="14" fill="#1E2A38"/>
  <rect x="206" y="246" width="44" height="8" rx="3" fill="#1E2A38"/>

  <!-- rollback-pil tillbaka -->
  <path d="M182 196 Q130 180 112 262" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#pil)"/>
  <text x="96" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#C0392B">rollback</text>

  <!-- steg 3: flagga för lasttest -->
  <line x1="340" y1="186" x2="340" y2="86" stroke="#1E2A38" stroke-width="4" stroke-linecap="round"/>
  <path d="M342 88 L392 100 L342 114 Z" fill="#E0B341" stroke="#1E2A38" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="340" cy="84" r="5" fill="#1E2A38"/>

  <!-- pratbubbla -->
  <path d="M420 40 h168 a16 16 0 0 1 16 16 v42 a16 16 0 0 1 -16 16 h-130 l-40 18 l14 -18 h-12 a16 16 0 0 1 -16 -16 v-42 a16 16 0 0 1 16 -16 z" fill="#2F6690"/>
  <text x="504" y="87" text-anchor="middle" font-size="30" font-weight="700" fill="#FBFBF8">Steg för steg!</text>

  <!-- infokort -->
  <rect x="420" y="140" width="446" height="300" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>
  <g transform="translate(0 -10)">
  <rect x="444" y="172" width="122" height="32" rx="16" fill="#1E2A38"/>
  <text x="505" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">PRESTANDA</text>
  <text x="580" y="195" font-size="20" font-weight="700" fill="#1E2A38">Stegvis utrullning</text>

  <circle cx="462" cy="238" r="16" fill="#2F6690"/>
  <text x="462" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">1</text>
  <text x="492" y="236" font-size="19" font-weight="700" fill="#1E2A38">Start med 350 samtidiga användare</text>
  <text x="492" y="258" font-size="16" fill="#4A5568">de första dagarna</text>

  <circle cx="462" cy="292" r="16" fill="#2F6690"/>
  <text x="462" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">2</text>
  <text x="492" y="290" font-size="19" font-weight="700" fill="#1E2A38">Förstärkt övervakning</text>
  <text x="492" y="312" font-size="16" fill="#4A5568">med tydliga tröskelvärden för rollback</text>

  <circle cx="462" cy="346" r="16" fill="#2F6690"/>
  <text x="462" y="353" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">3</text>
  <text x="492" y="344" font-size="19" font-weight="700" fill="#1E2A38">Lasttest med 500 användare</text>
  <text x="492" y="366" font-size="16" fill="#4A5568">så snart en miljö finns</text>

  <line x1="444" y1="388" x2="842" y2="388" stroke="#E3E8EE" stroke-width="2"/>
  <text x="444" y="412" font-size="16" fill="#1E2A38"><tspan font-weight="700">Varför:</tspan> fullt lasttest har inte kunnat göras före release</text>
  <text x="444" y="432" font-size="16" fill="#1E2A38"><tspan font-weight="700">Skydd:</tspan> rollback om tröskelvärdena överskrids</text>
  </g>
</svg>
