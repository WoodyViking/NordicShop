<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
  <title>Återstående tester – 12 regressionstester och 10 tester utan status körs eller förklaras, P1-flöden bekräftas i Chrome, Edge och Firefox</title>
  <defs>
    <g id="bock">
      <circle cx="0" cy="0" r="12" fill="#2E7D5B" stroke="#FBFBF8" stroke-width="2.5"/>
      <path d="M-5.5 0 l4 4 l7 -8" fill="none" stroke="#FBFBF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="glob">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#2F6690" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="7.5" ry="17" fill="none" stroke="#2F6690" stroke-width="2.5"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#2F6690" stroke-width="2.5"/>
      <path d="M-14 -9 Q0 -4 14 -9 M-14 9 Q0 4 14 9" fill="none" stroke="#2F6690" stroke-width="2"/>
    </g>
    <g id="fonster">
      <rect width="100" height="88" rx="8" fill="#FFFFFF" stroke="#1E2A38" stroke-width="3"/>
      <path d="M0 8 a8 8 0 0 1 8 -8 h84 a8 8 0 0 1 8 8 v12 h-100 z" fill="#1E2A38"/>
      <circle cx="12" cy="10" r="3" fill="#FBFBF8"/><circle cx="22" cy="10" r="3" fill="#FBFBF8"/><circle cx="32" cy="10" r="3" fill="#FBFBF8"/>
      <use href="#glob" x="50" y="44"/>
      <use href="#bock" x="94" y="2"/>
    </g>
  </defs>

  <!-- bakgrund -->
  <rect x="0" y="0" width="960" height="330" rx="24" fill="#F3F5F8"/>
  <circle cx="180" cy="170" r="150" fill="#E3EAF2"/>

  <!-- skrivplatta (skalad) -->
  <g transform="translate(-72 10) scale(0.85)">
    <rect x="126" y="56" width="220" height="262" rx="14" fill="#1E2A38" opacity="0.12"/>
    <rect x="120" y="50" width="220" height="262" rx="14" fill="#2C4A6E" stroke="#1E2A38" stroke-width="4"/>
    <rect x="134" y="74" width="192" height="226" rx="6" fill="#FFFFFF" stroke="#1E2A38" stroke-width="2"/>
    <rect x="190" y="36" width="80" height="28" rx="8" fill="#8A97A8" stroke="#1E2A38" stroke-width="3"/>
    <circle cx="230" cy="44" r="5" fill="#1E2A38"/>
    <text x="150" y="104" font-size="17" font-weight="700" fill="#1E2A38" letter-spacing="1">ÅTERSTÅR</text>
    <line x1="150" y1="114" x2="310" y2="114" stroke="#D5DBE3" stroke-width="2"/>

    <rect x="150" y="128" width="20" height="20" rx="4" fill="none" stroke="#2F6690" stroke-width="2.5"/>
    <text x="180" y="142" font-size="16" font-weight="700" fill="#1E2A38">Regression</text>
    <text x="180" y="160" font-size="13" fill="#4A5568">kör / förklara</text>
    <circle cx="298" cy="144" r="18" fill="#C8692A"/>
    <text x="298" y="151" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">12</text>

    <rect x="150" y="184" width="20" height="20" rx="4" fill="none" stroke="#2F6690" stroke-width="2.5"/>
    <text x="180" y="198" font-size="16" font-weight="700" fill="#1E2A38">Utan status</text>
    <text x="180" y="216" font-size="13" fill="#4A5568">kör / förklara</text>
    <circle cx="298" cy="200" r="18" fill="#C8692A"/>
    <text x="298" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#FBFBF8">10</text>

    <rect x="150" y="240" width="20" height="20" rx="4" fill="none" stroke="#2F6690" stroke-width="2.5"/>
    <text x="180" y="254" font-size="16" font-weight="700" fill="#1E2A38">P1-flöden</text>
    <text x="180" y="272" font-size="13" fill="#4A5568">3 webbläsare</text>
    <circle cx="298" cy="256" r="18" fill="#2F6690"/>
    <text x="298" y="263" text-anchor="middle" font-size="16" font-weight="700" fill="#FBFBF8">P1</text>
  </g>

  <!-- webbläsarfönster, staplade -->
  <g transform="translate(232 34) scale(0.9)">
    <use href="#fonster"/>
    <text x="50" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1E2A38">Chrome</text>
  </g>
  <g transform="translate(232 128) scale(0.9)">
    <use href="#fonster"/>
    <text x="50" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1E2A38">Edge</text>
  </g>
  <g transform="translate(232 222) scale(0.9)">
    <use href="#fonster"/>
    <text x="50" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1E2A38">Firefox</text>
  </g>

  <!-- pratbubbla -->
  <path d="M392 10 h196 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-150 l-44 14 l12 -14 h-14 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="#2F6690"/>
  <text x="490" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#FBFBF8">Inga lösa trådar!</text>

  <!-- infokort -->
  <rect x="360" y="78" width="580" height="238" rx="18" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="2"/>
  <rect x="384" y="96" width="132" height="30" rx="15" fill="#1E2A38"/>
  <text x="450" y="117" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">TESTSTATUS</text>
  <text x="530" y="118" font-size="20" font-weight="700" fill="#1E2A38">Återstående tester</text>

  <circle cx="400" cy="156" r="15" fill="#2F6690"/>
  <text x="400" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">1</text>
  <text x="428" y="154" font-size="18" font-weight="700" fill="#1E2A38">Resterande 12 regressionstester</text>
  <text x="428" y="174" font-size="15" fill="#4A5568">körs eller förklaras</text>

  <circle cx="400" cy="202" r="15" fill="#2F6690"/>
  <text x="400" y="208" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">2</text>
  <text x="428" y="200" font-size="18" font-weight="700" fill="#1E2A38">10 tester som saknar status</text>
  <text x="428" y="220" font-size="15" fill="#4A5568">körs eller förklaras</text>

  <circle cx="400" cy="248" r="15" fill="#2F6690"/>
  <text x="400" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#FBFBF8">3</text>
  <text x="428" y="246" font-size="18" font-weight="700" fill="#1E2A38">P1-flödena bekräftas</text>
  <text x="428" y="266" font-size="15" fill="#4A5568">i Chrome, Edge och Firefox</text>

  <line x1="384" y1="282" x2="916" y2="282" stroke="#E3E8EE" stroke-width="2"/>
  <text x="384" y="304" font-size="15" fill="#1E2A38"><tspan font-weight="700">Mål:</tspan> alla tester har en känd status</text>
</svg>
